{% extends "base.html" %}
{% load static %}
{% block content %}
<div class="page-header">
    <div class="media">
        <div class="media-left">
        </div>
        <div class="media-body">
            <h2 class="media-heading">🔐 Login</h2>
        </div>
    </div>
</div>
{% if messages %}{% for message in messages %}<div {% if message.tags %} class="alert alert-{{ message.tags }}"{% endif %}>{{ message }}</div>{% endfor %}{% endif %}
<div id="create_results"></div> <!-- errors go here -->
<br/>
<center>
{% if sso_enabled %}
<a class="btn btn-primary btn-block" href="{% url 'oidc_authentication_init' %}{% if request.GET.next %}?next={{ request.GET.next }}{% endif %}">Sign in with Microsoft</a>
<p class="text-muted">or</p>
{% endif %}
<form method="post" id="post-login" action="" class="form-inline">
    {% csrf_token %}
    <div class="form-group">
        <label for="username">Username</label>
        <input type="text" class="form-control" id="username" name="username" placeholder="Username">
    </div>
    <div class="form-group">
        <label for="password">Password</label>
        <input type="password" class="form-control" id="password" name="password" placeholder="Password">
    </div>
    <input type="hidden" name="next" value="{{ request.GET.next }}" />
    <button type="submit" class="btn btn-primary">Login</button>
</form>
</center>
{% endblock%}
